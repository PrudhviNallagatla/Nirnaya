[project]
name = "nirnaya"
version = "0.1.0"
requires-python = ">=3.11"
description = "C++ interface contract verification tool"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = [
	"libclang",
	"pydantic>=2",
	"rich>=13",
	"typer>=0.12",
	"typing_extensions>=4.12",
]

[tool.ruff]
line-length = 88

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
nirnaya = "nirnaya.cli:app"